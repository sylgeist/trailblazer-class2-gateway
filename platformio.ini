; PlatformIO project file. The same sources also open in the Arduino IDE:
; open firmware/gateway/gateway.ino and install the "mcp_can" library.

[platformio]
src_dir = firmware/gateway
test_dir = test
default_envs = mega

; Rugged MEGA-ET ST (ATmega2560)
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    coryjfowler/mcp_can@^1.5.0

; Host-side unit tests for the hardware-independent logic:  pio test -e native
[env:native]
platform = native
test_build_src = yes
build_flags = -std=c++11 -Wall -Wextra
build_src_filter =
    +<j1850_crc.cpp>
    +<class2_frame.cpp>
    +<message_table.cpp>
    +<maxx_decode.cpp>
