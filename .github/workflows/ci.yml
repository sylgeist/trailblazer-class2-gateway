name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    name: Capture tools (Python tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python -m unittest -v
        working-directory: tools

  firmware:
    name: Firmware (unit tests + Mega build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Unit tests on the host
        run: pio test -e native
      - name: Build for the Mega 2560
        run: pio run -e mega
